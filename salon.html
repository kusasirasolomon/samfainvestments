<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon | Samfa Investments</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/stention.css">


</head>

<body>

    <header id="navbar"></header>

    <section class="container" style="padding:40px 20px;">
        <h1 style="color:#C9A84C;">💇 Salon Services</h1>
        <p style="color:#7D8590;margin-bottom:30px;">
            Professional grooming, beauty, and styling services.
        </p>

        <!-- Images -->
        <div class="products-grid">

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1" alt="Haircut">
                <h3>Haircuts</h3>
                <p>Modern and stylish cuts for men and women.</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1582095133179-bfd08e2fc6b3" alt="Salon tools">
                <h3>Professional Tools</h3>
                <p>We use high-quality equipment for best results.</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" alt="Hair styling">
                <h3>Hair Styling</h3>
                <p>Perfect styling for events and daily looks.</p>
            </div>

        </div>

        <!-- Video Section -->
        <div style="margin-top:40px;">
            <h2 style="color:#E6EDF3;">✂️ How We Work</h2>

            <video controls style="width:100%;max-width:700px;border-radius:12px;margin-top:15px;">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support video.
            </video>
        </div>

        <!-- Booking Button -->
        <div style="margin-top:40px;">
            <a href="contact.html" class="btn btn-gold"
                style="padding:14px 24px;display:inline-block;text-decoration:none;">
                Book a Service →
            </a>
        </div>

    </section>

    <footer id="footer"></footer>

    <script src="js/main.js"></script>
</body>

</html>
